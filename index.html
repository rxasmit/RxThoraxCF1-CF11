<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thorax Block | USMLE-style practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf1;color:#1b1f23;font:16px/1.5 Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.hd,.ft{background:#16365c;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-size:14px}
.hd b{font-size:15px}.hd .r{display:flex;gap:14px;align-items:center}
.ft{position:sticky;bottom:0}
.wrap{flex:1;display:flex;min-height:0}
.nav{width:132px;background:#f6f8fa;border-right:1px solid #c3ccd5;padding:10px 8px;overflow:auto;max-height:calc(100vh - 90px);position:sticky;top:0;align-self:flex-start}
.nav button{width:34px;height:30px;margin:2px;border:1px solid #9aa7b4;background:#fff;font:13px Arial;cursor:pointer;position:relative}
.nav .cur{outline:2px solid #16365c}.nav .ok{background:#cdeed8}.nav .bad{background:#f7cfcc}
.nav .mk::after{content:"";position:absolute;right:1px;top:1px;border:4px solid #d4a000;border-left-color:transparent;border-bottom-color:transparent}
.main{flex:1;padding:18px;max-width:900px}
.ctx{display:inline-block;background:#dbe6f2;border:1px solid #b5c6da;color:#16365c;font-size:13px;font-weight:bold;padding:2px 9px;margin-bottom:10px}
.q{font-size:18px;margin:0 0 16px}
.c{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid #b7c1cb;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.c:disabled{cursor:default}.c i{font-style:normal;font-weight:bold;min-width:20px;height:20px;border:2px solid #5a6b7c;border-radius:50%;font-size:11px;text-align:center;line-height:16px;flex:none}
.c.ok{background:#d9f2e1;border-color:#2e8b57}.c.ok i{background:#2e8b57;border-color:#2e8b57;color:#fff}
.c.bad{background:#fbdad7;border-color:#c0392b}.c.bad i{background:#c0392b;border-color:#c0392b;color:#fff}
.ex{scroll-margin-bottom:70px;background:#fff;border:1px solid #b7c1cb;border-left:5px solid #16365c;margin-top:14px;padding:14px 16px}
.ex h3{margin:0 0 6px;font-size:16px}.ex .t{font-weight:bold}
.ex .o{background:#eef3f8;border:1px solid #c9d6e4;padding:8px 10px;margin-top:10px;font-size:15px}
.bt{font:inherit;font-weight:bold;background:#fff;color:#16365c;border:1px solid #fff;padding:6px 16px;cursor:pointer}
.bt:disabled{opacity:.4}.bt.g{background:transparent;color:#fff;border-color:#8fa6c1}
.card{background:#fff;border:1px solid #b7c1cb;padding:18px;margin:18px;max-width:760px}
.chips label{display:inline-block;margin:3px 6px 3px 0}.chips span{display:inline-block;border:1px solid #9aa7b4;padding:3px 10px;font-size:14px;cursor:pointer;background:#fff}
.chips input{position:absolute;opacity:0}.chips input:checked+span{background:#16365c;color:#fff;border-color:#16365c}.chips input:focus-visible+span{outline:2px solid #d4a000}
.card .bt{background:#16365c;color:#fff;border-color:#16365c}.sg button{font:inherit;margin:0 6px 10px 0;padding:4px 14px;border:1px solid #9aa7b4;background:#fff;cursor:pointer}.sg .on{background:#16365c;color:#fff}
button:focus-visible{outline:2px solid #d4a000}
@media(max-width:640px){.nav{display:none}.main{padding:12px}}
</style></head><body>

<script>
const D=[{"g":"3-1 · Thoracic cage injuries","q":"Thoracic injuries cause roughly what share of trauma deaths?","c":"About 25%","w":["About 5%","About 10%","Nearly 50%"],"e":"About 25% of trauma deaths are thoracic; the heart, great vessels, airway or cage may be involved.","ob":"Thoracic trauma accounts for about a quarter of trauma deaths."},{"g":"3-1 · Thoracic cage injuries","q":"Which rib groups are more protected and often escape fracture?","c":"Ribs 1–2 and 11–12","w":["Ribs 5–6 and 7–8 together","Ribs 3–4 and 9–10 together","Ribs 4–6 and 8–10 together"],"e":"The first two and last two ribs are better protected, so they fracture less often.","ob":"Ribs 1–2 and 11–12 are the best protected and least often fractured."},{"g":"3-1 · Thoracic cage injuries","q":"Why is pain from rib fractures so intense?","c":"Breathing keeps moving the fractured ribs","w":["Fragments always compress the spinal nerve roots","Periosteal swelling spreads to the diaphragm","Bone marrow release inflames the pleural lining"],"e":"The rib cage expands and contracts with every breath, so the fracture never rests.","ob":"Rib fracture pain is severe because every breath moves the injury."},{"g":"3-1 · Thoracic cage injuries","q":"Which procedure can palliate severe fractured-rib pain?","c":"Intercostal nerve block","w":["Phrenic nerve block","Thoracic epidural injection","Interscalene brachial block"],"e":"Anesthetizing the intercostal nerve relieves the pain of rib fractures.","ob":"An intercostal nerve block palliates fractured-rib pain."},{"g":"3-1 · Thoracic cage injuries","q":"Which injection site is preferred for an intercostal nerve block?","c":"Angle of the rib","w":["Posterior axillary line","Anterior axillary line","Parasternal region"],"e":"The angle of the rib is preferred; axillary lines, the fracture site and parasternal sites are alternatives.","ob":"The angle of the rib is the preferred intercostal block site."},{"g":"3-1 · Thoracic cage injuries","q":"After contacting the lower border of the rib, how is the needle advanced?","c":"Caudad, advanced about 1/8 inch","w":["Cephalad, advanced about 1/8 inch","Caudad, advanced about 1 inch deep","Cephalad, advanced about 1 inch deep"],"e":"The needle is withdrawn slightly, aimed caudad and advanced 1/8 inch to slip under the rib.","ob":"Pass under the rib's lower border, aim caudad and advance about 1/8 inch."},{"g":"3-1 · Thoracic cage injuries","q":"Why should you aspirate before injecting the anesthetic?","c":"To avoid causing a pneumothorax","w":["To confirm the needle reached the spinal canal","To measure the volume of pleural fluid present","To warm the anesthetic before it is injected"],"e":"Aspirating first helps avoid pneumothorax when the needle lies near the pleura.","ob":"Aspirate before injecting to avoid pneumothorax during an intercostal block."},{"g":"3-1 · Thoracic cage injuries","q":"Which finding makes a rib injury 'complicated'?","c":"Hemothorax from a torn vessel","w":["A single transverse rib fracture","Costochondral separation alone","Chondrosternal separation only"],"e":"Complicated injuries involve pleura, lung, vessels or heart; simple ones are isolated cage injuries.","ob":"Complicated cage injuries involve pleura, lung, great vessels or the heart."},{"g":"3-1 · Thoracic cage injuries","q":"Which injury belongs to the 'simple' group?","c":"Costochondral separation","w":["Pneumothorax with subcutaneous emphysema","Hemothorax from a torn vessel","Missile wound with heart injury"],"e":"Simple: transverse, oblique, overriding and chondral fractures, costochondral or chondrosternal separation, sternal fracture.","ob":"Simple cage injuries are isolated fractures, dislocations and separations."},{"g":"3-1 · Thoracic cage injuries","q":"Which is a pleural or lung complication of chest injury?","c":"Subcutaneous emphysema","w":["Costovertebral dislocation","Overriding rib fracture","Chondrosternal separation"],"e":"Pneumothorax, lung contusion and subcutaneous emphysema mark pleural or lung trauma.","ob":"Pneumothorax, contusion and subcutaneous emphysema signal pleural or lung injury."},{"g":"3-2 · Fibrocystic breast disease","q":"Fibrocystic change occurs in about what share of women?","c":"About 80%","w":["About 20%","About 50%","Nearly 95%"],"e":"It is a nonspecific term for benign conditions seen in about 80% of women.","ob":"Fibrocystic change is a benign condition affecting about 80% of women."},{"g":"3-2 · Fibrocystic breast disease","q":"Fibrocystic change is linked mainly to which process?","c":"Cyclic changes in glandular tissue","w":["Chronic bacterial infection of ducts","Autoimmune destruction of lobules","Malignant transformation of ducts"],"e":"It relates to cyclic changes in maturation and involution of glandular tissue.","ob":"Fibrocystic change reflects cyclic changes in glandular tissue."},{"g":"3-2 · Fibrocystic breast disease","q":"Which description fits fibrocystic disease?","c":"Tender, granular swelling","w":["Painless, firm, mobile solitary mass","Hard fixed mass with peau d'orange skin","Bloody discharge from a single duct"],"e":"The syndrome is tender, granular swelling; the other options describe fibroadenoma, cancer and papilloma.","ob":"Tender, granular swelling characterizes fibrocystic disease."},{"g":"3-2 · Fibrocystic breast disease","q":"What is the most common breast mass?","c":"Fibroadenoma","w":["Benign papilloma","Ductal carcinoma","Fibrocystic cyst"],"e":"Fibroadenoma is the second most common breast disease and the most common breast mass.","ob":"Fibroadenoma is the most common breast mass."},{"g":"3-2 · Fibrocystic breast disease","q":"What is the peak age for fibroadenoma?","c":"20 to 25 years","w":["35 to 45 years","50 to 60 years","Over 65 years of age"],"e":"Peak incidence is 20 to 25 years, with most cases below 30.","ob":"Fibroadenoma peaks at 20–25 years and mostly occurs below 30."},{"g":"3-2 · Fibrocystic breast disease","q":"How does a fibroadenoma usually present?","c":"Firm, painless, mobile, solitary mass","w":["Hard, painful, fixed, irregular mass","Soft, tender, fixed, multiple lumps","Hard, fixed mass with peau d'orange skin"],"e":"Fibroadenomas are firm, painless, mobile, solitary palpable masses.","ob":"Fibroadenoma is firm, painless, mobile and solitary."},{"g":"3-2 · Fibrocystic breast disease","q":"What is a fibroadenoma, histologically?","c":"Benign neoplasm of glandular epithelium","w":["Malignant tumor of the mammary stroma","Inflammatory change of lactiferous ducts","Cystic dilation of the nipple ducts"],"e":"It is a benign glandular epithelial neoplasm with increased periductal connective tissue.","ob":"Fibroadenoma is a benign glandular epithelial neoplasm with periductal connective tissue."},{"g":"3-2 · Fibrocystic breast disease","q":"What is true of fibroadenomas in adolescence?","c":"They may grow rapidly and need follow-up","w":["They typically shrink by puberty without review","They become cystic and then disappear fully","They stay static and never need re-examination"],"e":"They may grow rapidly in adolescence and warrant follow-up evaluation.","ob":"Rapidly growing adolescent breast masses warrant follow-up evaluation."},{"g":"3-2 · Fibrocystic breast disease","q":"Which feature points to a benign intracystic papilloma?","c":"Discharge from the nipple","w":["Peau d'orange skin change","Nipple inversion from duct shortening","Cyclic tender granular swelling"],"e":"Papilloma presents with nipple discharge; peau d'orange and inversion suggest cancer.","ob":"Nipple discharge is the clue to an intracystic papilloma."},{"g":"3-2 · Fibrocystic breast disease","q":"Which structure is seen in a benign intracystic papilloma?","c":"A papilloma on a fibrous stalk","w":["A stellate irregular mass with margins","A cluster of tender granular cysts","A firm mobile mass with a capsule"],"e":"The papilloma sits within breast tissue attached by a fibrous stalk.","ob":"An intracystic papilloma hangs on a fibrous stalk inside a cyst."},{"g":"3-3 · Breast cancer","q":"Which is the most common type of breast cancer?","c":"Infiltrating ductal carcinoma","w":["Inflammatory lobular carcinoma","Medullary papillary carcinoma","Intraductal papilloma variant"],"e":"Infiltrating ductal carcinoma accounts for about 75% of cases.","ob":"Infiltrating ductal carcinoma is the dominant breast cancer type."},{"g":"3-3 · Breast cancer","q":"About what share of breast cancers are infiltrating ductal?","c":"About 75%","w":["About 25%","About 50%","Nearly 95%"],"e":"Roughly three quarters of breast cancers are infiltrating ductal carcinoma.","ob":"About three quarters of breast cancers are infiltrating ductal."},{"g":"3-3 · Breast cancer","q":"In which group do more than two thirds of cases occur?","c":"Postmenopausal women","w":["Women under 30 years","Adolescent girls","Women in first pregnancy"],"e":"Over two thirds of breast cancers occur in postmenopausal women.","ob":"Most breast cancers occur in postmenopausal women."},{"g":"3-3 · Breast cancer","q":"Which breast quadrant holds about 60% of palpable tumors?","c":"Upper outer quadrant","w":["Upper inner quadrant","Lower outer quadrant","Central subareolar region only"],"e":"The upper outer quadrant is closest to the axilla and includes the axillary tail.","ob":"The upper outer quadrant, nearest the axilla, hosts most palpable tumors."},{"g":"3-3 · Breast cancer","q":"What causes skin dimpling over a breast carcinoma?","c":"Retracted suspensory ligaments","w":["Obstruction of subcutaneous lymphatics","Shortening of the mammary ducts","Fixation of the tumor to pectoralis major"],"e":"Tumor involvement retracts the suspensory (Cooper's) ligaments and dimples the skin.","ob":"Cooper's ligament retraction produces skin dimpling."},{"g":"3-3 · Breast cancer","q":"What produces the 'orange peel' (peau d'orange) skin?","c":"Lymphatic obstruction with skin edema","w":["Retraction of Cooper's ligaments by tumor","Shortening of the mammary ducts to skin","Venous thrombosis of superficial breast veins"],"e":"Obstructed subcutaneous lymphatics dilate and cause edema, making skin gland orifices prominent.","ob":"Lymphatic obstruction and edema produce peau d'orange."},{"g":"3-3 · Breast cancer","q":"What causes nipple retraction in breast cancer?","c":"Carcinoma shortening the mammary ducts","w":["Edema from obstructed subcutaneous lymphatics","Fibrous retraction of Cooper's ligaments only","Hormonal atrophy of the areolar glands"],"e":"Carcinoma involving mammary ducts shortens them and retracts or inverts the nipple.","ob":"Duct shortening by carcinoma retracts or inverts the nipple."},{"g":"3-3 · Breast cancer","q":"What share of breast cancers have a familial or genetic link?","c":"About 5–10%","w":["About 25–30%","About 40–50%","About 70–80%"],"e":"Only about 5–10% have a familial or genetic link.","ob":"Only 5–10% of breast cancers are familial or genetic."},{"g":"3-3 · Breast cancer","q":"Which genes are linked to familial breast cancer?","c":"BRCA1 and BRCA2","w":["RB1 and APC genes","MYC and RAS genes","CFTR and HFE genes"],"e":"BRCA1 and BRCA2 are tumor suppressor genes tied to inherited breast cancer.","ob":"BRCA1 and BRCA2 mutations underlie familial breast cancer."},{"g":"3-3 · Breast cancer","q":"Which set lists typical distant metastasis sites?","c":"Lungs and pleura, liver, bones, brain","w":["Kidneys, spleen, thyroid and ovaries only","Skin, spleen, adrenal glands and eyes","Thyroid, kidneys, stomach and pancreas"],"e":"Distant spread goes to lungs and pleura, liver, bones and brain.","ob":"Breast cancer spreads to lungs and pleura, liver, bones and brain."},{"g":"3-4 · Partial mastectomy","q":"Which names also describe a partial mastectomy?","c":"Lumpectomy or quadrantectomy","w":["Radical (Halsted) mastectomy","Total (simple) mastectomy","Axillary node dissection alone"],"e":"Partial mastectomy is breast-conserving, also called lumpectomy or quadrantectomy.","ob":"Partial mastectomy is breast-conserving surgery (lumpectomy or quadrantectomy)."},{"g":"3-4 · Partial mastectomy","q":"What does a partial mastectomy remove?","c":"Tumor plus a halo of normal tissue","w":["The entire breast with axillary nodes","Only the nipple and areola complex","Tumor alone with no margin of tissue"],"e":"The tumor is removed with a surrounding halo of normal breast tissue.","ob":"Partial mastectomy removes the tumor with a margin of normal tissue."},{"g":"3-4 · Partial mastectomy","q":"Why is a sentinel node biopsy done?","c":"To examine the first axillary node","w":["To remove all the parasternal nodes","To shrink the tumor before surgery","To locate the stellate mass early"],"e":"The first axillary node is the one most likely invaded by metastatic cells.","ob":"Sentinel node biopsy tests the first axillary node draining the tumor."},{"g":"3-4 · Partial mastectomy","q":"How does infiltrating carcinoma look in a breast cross section?","c":"A stellate, irregular mass","w":["A smooth rounded mobile mass","A thin-walled fluid-filled cyst","A uniform fatty nodule"],"e":"Infiltrating carcinoma appears as a stellate, irregular mass.","ob":"Infiltrating carcinoma appears as a stellate, irregular mass."},{"g":"3-4 · Partial mastectomy","q":"Which pair are 'local' approaches to breast cancer?","c":"Radiation therapy and surgery","w":["Chemotherapy and hormonal therapy","Immunotherapy and hormonal therapy","Chemotherapy and immunotherapy only"],"e":"Systemic: chemotherapy, hormonal, immunotherapy. Local: radiation and surgery.","ob":"Radiation and surgery are local therapies; chemotherapy, hormonal and immunotherapy are systemic."},{"g":"3-4 · Partial mastectomy","q":"Which incision parallels Langer's lines in the upper breast?","c":"Curvilinear incisions","w":["Radial incisions","Circumareolar incisions","Vertical midline incisions"],"e":"Curvilinear incisions follow Langer's lines in the upper half for a better aesthetic result.","ob":"Curvilinear incisions follow Langer's lines in the upper breast."},{"g":"3-4 · Partial mastectomy","q":"Where are radial incisions used?","c":"Inferior half of the breast","w":["Superior half of the breast","Over the axillary tail only","Along the inframammary crease"],"e":"Radial incisions are used in the inferior half; curvilinear ones in the upper half.","ob":"Radial incisions are used in the lower half of the breast."},{"g":"3-4 · Partial mastectomy","q":"Which eponym names the interpectoral lymph nodes?","c":"Rotter's nodes","w":["Virchow's nodes","Cloquet's nodes","Delphian nodes"],"e":"Rotter's nodes lie between pectoralis major and minor.","ob":"Rotter's nodes are the interpectoral lymph nodes."},{"g":"3-4 · Partial mastectomy","q":"Which axillary node group is also called subclavian?","c":"Apical axillary nodes","w":["Central axillary nodes","Posterior axillary nodes","Lateral axillary nodes"],"e":"Apical = subclavian, posterior = subscapular, lateral = humeral, anterior = pectoral.","ob":"Apical axillary nodes are the subclavian group."},{"g":"3-4 · Partial mastectomy","q":"How is the removed specimen handled?","c":"Oriented with a suture","w":["Sent unmarked to pathology","Frozen on the operating table","Divided into equal quarters"],"e":"A suture orients the specimen so margins can be identified.","ob":"A suture orients the specimen for margin assessment."},{"g":"3-5 · Modified radical mastectomy","q":"What does a total (simple) mastectomy remove?","c":"The whole breast, nodes if indicated","w":["The whole breast with pectoral muscles","The tumor with a halo of normal tissue","Breast tissue and chest wall muscles only"],"e":"The whole breast is removed, with axillary nodes only if indicated, down to the retromammary space.","ob":"Total mastectomy removes the whole breast, with nodes only if indicated."},{"g":"3-5 · Modified radical mastectomy","q":"Which muscles are preserved in a modified radical mastectomy?","c":"Pectoralis, serratus anterior, latissimus dorsi","w":["Pectoralis minor, rhomboid major and trapezius","Subscapularis, teres major and supraspinatus group","Deltoid, biceps brachii and coracobrachialis group"],"e":"Pectoralis, serratus anterior and latissimus dorsi are preserved, with the long thoracic and thoracodorsal nerves.","ob":"Modified radical mastectomy preserves pectoralis, serratus anterior and latissimus dorsi."},{"g":"3-5 · Modified radical mastectomy","q":"What does a radical mastectomy remove?","c":"Breast, nodes, fat and both pectoralis muscles","w":["Breast, nodes, fat and the serratus anterior","Breast, nodes, fat and the latissimus dorsi","Breast, nodes, fat but preserving both pectorals"],"e":"It takes breast, axillary nodes, fat and pectoralis major and minor.","ob":"Radical mastectomy also removes pectoralis major and minor."},{"g":"3-5 · Modified radical mastectomy","q":"What follows damage to the long thoracic nerve?","c":"Winging of the scapula","w":["Weak extension at the shoulder","Loss of sensation over the axilla","Weak elbow flexion on lifting"],"e":"The long thoracic nerve supplies serratus anterior; injury wings the scapula.","ob":"Long thoracic nerve injury wings the scapula."},{"g":"3-5 · Modified radical mastectomy","q":"Which nerve supplies the serratus anterior?","c":"Long thoracic nerve","w":["Thoracodorsal nerve","Medial pectoral nerve","Intercostobrachial nerve"],"e":"Long thoracic nerve to serratus anterior; thoracodorsal nerve to latissimus dorsi.","ob":"The long thoracic nerve supplies serratus anterior."},{"g":"3-5 · Modified radical mastectomy","q":"What follows damage to the thoracodorsal nerve?","c":"Weakened extension at the shoulder","w":["Winging of the scapula on pushing","Loss of sensation over the inner arm","Weak flexion at the elbow joint"],"e":"It supplies latissimus dorsi, so extension at the shoulder weakens.","ob":"Thoracodorsal nerve injury weakens shoulder extension."},{"g":"3-5 · Modified radical mastectomy","q":"Which muscle does the thoracodorsal nerve supply?","c":"Latissimus dorsi","w":["Serratus anterior","Pectoralis major","Teres major muscle"],"e":"The thoracodorsal nerve innervates latissimus dorsi.","ob":"The thoracodorsal nerve innervates latissimus dorsi."},{"g":"3-5 · Modified radical mastectomy","q":"How are the superior and inferior skin flaps held?","c":"Retracted perpendicular to the chest wall","w":["Folded flat against the chest wall surface","Sutured to the pectoral fascia at the edge","Retracted laterally into the axillary fossa"],"e":"Flaps are retracted perpendicular to the chest wall while breast tissue is retracted downward.","ob":"Skin flaps are raised and held perpendicular to the chest wall."},{"g":"3-5 · Modified radical mastectomy","q":"Between which muscles do Rotter's nodes lie?","c":"Pectoralis major and minor","w":["Serratus anterior and latissimus","Pectoralis minor and serratus anterior","Latissimus dorsi and subscapularis"],"e":"Rotter's (interpectoral) nodes lie between the two pectoral muscles.","ob":"Rotter's nodes lie between pectoralis major and minor."},{"g":"3-5 · Modified radical mastectomy","q":"Which approach is much less common now?","c":"Radical mastectomy","w":["Total (simple) mastectomy","Partial mastectomy (lumpectomy)","Modified radical mastectomy"],"e":"Radical mastectomy is far less used now than the modified approach.","ob":"Radical mastectomy has largely been replaced by modified approaches."},{"g":"3-6 · Chest tube thoracostomy","q":"How is the patient positioned for chest tube insertion?","c":"Supine, arm abducted, hand above head","w":["Seated upright, arm resting at the side","Lateral decubitus, arm adducted at the side","Prone, arm abducted beside the head"],"e":"Supine, arm abducted, elbow flexed, hand over the head.","ob":"Position supine with the arm abducted and the hand over the head."},{"g":"3-6 · Chest tube thoracostomy","q":"Where is the tube inserted?","c":"4th–5th space, anterior axillary line","w":["2nd–3rd space, midclavicular line","6th–7th space, posterior axillary line","8th–9th space, midscapular line"],"e":"The 4th–5th intercostal spaces in the anterior axillary line, at nipple level.","ob":"Insert in the 4th–5th intercostal space, anterior axillary line."},{"g":"3-6 · Chest tube thoracostomy","q":"Which imaging tool helps locate the intercostal spaces?","c":"Ultrasonography","w":["Barium swallow study","Lumbar myelography","Bone scintigraphy"],"e":"Ultrasonography is used to locate the 4th and 5th intercostal spaces.","ob":"Ultrasonography helps locate the correct intercostal space."},{"g":"3-6 · Chest tube thoracostomy","q":"Which rib is identified for periosteal anesthesia?","c":"The rib just below the space","w":["The rib just above the space","The nearest floating rib margin","Both ribs bordering the space"],"e":"The rib inferior to the chosen space is identified and its periosteum anesthetized.","ob":"Anesthetize the periosteum of the rib below the chosen space."},{"g":"3-6 · Chest tube thoracostomy","q":"What confirms entry into the pleural space?","c":"Flash of fluid or air in the syringe","w":["Return of bright red arterial blood only","A sudden pop felt at the skin surface","Loss of all resistance at the skin edge"],"e":"A flash of pleural fluid or air in the syringe confirms entry.","ob":"A flash of pleural fluid or air confirms pleural entry."},{"g":"3-6 · Chest tube thoracostomy","q":"What is the skin incision like?","c":"1–2 cm, parallel to the rib","w":["5–6 cm, perpendicular to the rib","1–2 cm, perpendicular to the rib","3–4 cm, across two adjacent ribs"],"e":"A 1- to 2-cm incision is made parallel to the rib.","ob":"Make a 1–2 cm incision parallel to the rib."},{"g":"3-6 · Chest tube thoracostomy","q":"Why is a finger rotated 360° in the pleural space?","c":"To feel for pleural adhesions","w":["To break the visceral pleura open","To find the intercostal artery path","To stretch the diaphragm downward"],"e":"The finger sweep checks for adhesions before the tube is placed.","ob":"A finger sweep checks for adhesions before tube placement."},{"g":"3-6 · Chest tube thoracostomy","q":"Which part of the tube is grabbed with the Kelly clamp?","c":"The fenestrated portion","w":["The proximal connector end","The sealed stylet handle","The drainage device hub"],"e":"The fenestrated portion is grabbed and introduced through the insertion site.","ob":"The fenestrated end of the tube is the part introduced into the chest."},{"g":"3-6 · Chest tube thoracostomy","q":"What is wrapped around the tube at the site?","c":"Petroleum-based gauze","w":["Dry sterile cotton packing","Silver-impregnated foam dressing","Iodine-soaked adhesive film"],"e":"Petroleum-based gauze goes around the tube, covered by regular gauze and tape.","ob":"Petroleum-based gauze seals the tube site."},{"g":"3-6 · Chest tube thoracostomy","q":"How is correct tube placement confirmed?","c":"Chest radiograph","w":["Pulse oximetry only","Bronchoscopy","Echocardiography"],"e":"A chest radiograph confirms proper placement after connecting the drainage device.","ob":"Chest radiography confirms chest tube position."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"How is idiopathic pulmonary fibrosis classified?","c":"Chronic restrictive lung disease","w":["Chronic obstructive lung disease","Acute infectious pneumonia","Vascular lung disease with emboli"],"e":"IPF is a chronic restrictive disease with reduced compliance.","ob":"IPF is a chronic restrictive lung disease."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"IPF mainly affects people of what age?","c":"Over 50 years of age","w":["Under 20 years of age","20 to 30 years of age","30 to 40 years of age"],"e":"IPF mainly affects people over 50.","ob":"IPF mainly affects people over 50."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which is a major risk factor for IPF?","c":"Cigarette smoking","w":["Chronic alcohol intake","High dietary salt intake","Recurrent urinary infections"],"e":"Cigarette smoking is a major risk factor.","ob":"Cigarette smoking is a major risk factor for IPF."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Chronic restrictive diseases make up what share of noninfectious lung disease?","c":"About 15%","w":["About 5%","About 40%","Nearly 65%"],"e":"They account for about 15% of noninfectious lung diseases.","ob":"Chronic restrictive diseases are about 15% of noninfectious lung disease."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Why does a fibrotic lung need more pressure to inflate?","c":"It is stiffened and less compliant","w":["Its airways collapse during expiration","Its alveolar walls are destroyed","Mucus plugs obstruct the bronchi"],"e":"Fibrosis stiffens the lung, lowering compliance.","ob":"Fibrosis stiffens the lung, so inflation needs more pressure."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which auscultation finding is typical of IPF?","c":"Basilar inspiratory (Velcro) crackles","w":["Bilateral expiratory wheezes at the apices","Biphasic stridor over the trachea","Pleural friction rub over the apices"],"e":"Basilar inspiratory 'Velcro' crackles are classic.","ob":"Basilar inspiratory Velcro crackles are the classic IPF sign."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which finger change is seen in IPF?","c":"Clubbing of the fingers","w":["Splinter hemorrhages of nails","Raynaud pallor of fingertips","Spooning of the nails"],"e":"Clubbing accompanies dyspnea, cyanosis and weight loss.","ob":"Clubbing, cyanosis and dyspnea accompany IPF."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"What kind of cough is typical?","c":"Nonproductive hacking cough","w":["Productive cough with purulent sputum","Barking cough with stridor","Paroxysmal whooping cough"],"e":"The cough is nonproductive and hacking.","ob":"IPF causes a nonproductive hacking cough."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"How does the gross lung specimen look?","c":"Multiple small cysts, honeycomb pattern","w":["Single large apical cavity with fluid level","Hilar mass projecting into a bronchus","Barrel-shaped hyperinflated upper lobes"],"e":"Diffuse bilateral fibrosis with small cysts gives a honeycomb appearance.","ob":"The fibrotic lung has small cysts in a honeycomb pattern."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which late complication occurs?","c":"Cor pulmonale","w":["Left atrial myxoma","Aortic coarctation","Pericardial effusion"],"e":"Late disease can cause cor pulmonale.","ob":"Cor pulmonale is a late complication of IPF."},{"g":"3-8 · Pulmonary embolism","q":"PE causes death in what share of hospitalized patients?","c":"About 10–15%","w":["About 30–40%","About 50–60%","Roughly 2 to 3%"],"e":"PE causes death in 10–15% of hospitalized patients.","ob":"PE causes death in 10–15% of hospitalized patients."},{"g":"3-8 · Pulmonary embolism","q":"Where do about 90% of thromboemboli originate?","c":"Deep veins of the legs","w":["Pelvic venous plexus","Superficial veins of the arm","Right side of the heart"],"e":"About 90% come from deep leg veins.","ob":"Most pulmonary emboli come from deep leg veins."},{"g":"3-8 · Pulmonary embolism","q":"Which trio makes up Virchow's triad?","c":"Stasis, vessel trauma, hypercoagulability","w":["Stasis, infection, hypocoagulability","Hypertension, trauma, hypocoagulability","Hypertension, vessel trauma, hypercoagulability"],"e":"Virchow's triad: venous stasis, trauma and coagulation disorders.","ob":"Virchow's triad is stasis, vessel injury and hypercoagulability."},{"g":"3-8 · Pulmonary embolism","q":"Which situation raises PE risk?","c":"Postoperative immobility","w":["Regular aerobic exercise training","High daily fluid intake","Long-term vitamin supplements"],"e":"Postoperative and postpartum immobility, and some hormone medications, raise risk.","ob":"Immobility after surgery or childbirth raises PE risk."},{"g":"3-8 · Pulmonary embolism","q":"Why are most PEs 'silent'?","c":"Most emboli are small and filtered","w":["Most emboli lodge in the bronchial tree","Clots dissolve before leaving the leg veins","Pulmonary vessels have no sensory inne ."},{"g":"3-11 · Cardiac tamponade","q":"What does tamponade do to hemodynamics?","c":"Reduces venous return and cardiac output","w":["Increases preload with raised cardiac output","Lowers afterload with raised stroke volume","Raises venous return and lowers heart rate"],"e":"It compromises the beating heart, decreasing venous return and cardiac output.","ob":"Tamponade lowers venous return and cardiac output."},{"g":"3-11 · Cardiac tamponade","q":"How can the pericardial fluid be removed?","c":"Pericardial tap","w":["Needle thoracentesis","Lumbar puncture","Paracentesis"],"e":"A pericardial tap withdraws the fluid by needle and syringe.","ob":"A pericardial tap removes the fluid."},{"g":"3-11 · Cardiac tamponade","q":"Where is the pericardial tap performed?","c":"Larrey's point","w":["Erb's point","McBurney's point","Kocher's point"],"e":"Larrey's point is the site, diagnostic and decompressive.","ob":"The pericardial tap is done at Larrey's point."},{"g":"3-11 · Cardiac tamponade","q":"What happens to the neck veins?","c":"They become distended","w":["They collapse completely","They stay completely normal","They pulse only on inspiration"],"e":"Distended neck veins reflect elevated venous pressure.","ob":"Distended neck veins accompany tamponade."},{"g":"3-11 · Cardiac tamponade","q":"How are the heart sounds described?","c":"Distant or muffled","w":["Loud with a murmur","Widely split with a click","Normal with a third sound"],"e":"Heart sounds are distant.","ob":"Heart sounds are distant in tamponade."},{"g":"3-11 · Cardiac tamponade","q":"Which finding is pathognomonic?","c":"Elevated venous pressure","w":["Decreased pulse pressure","Decreased arterial pressure","Variable degrees of shock"],"e":"Elevated venous pressure is pathognomonic; low arterial and pulse pressures are not.","ob":"Elevated venous pressure is pathognomonic for tamponade."},{"g":"3-11 · Cardiac tamponade","q":"What is the pericardial tap used for?","c":"Diagnosis and decompression","w":["Diag const $=id=>document.getElementById(id),E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const G=[];D.forEach(x=>{if(!G.includes(x.g))G.push(x.g)});
const cnt=G.map(g=>D.filter(x=>x.g===g).length);
let shufQ=false,sel=new Set(G.map((_,k)=>k)),size=0,Q=[],n=0,last=null,t0=0,tick=null,live=false;

function pool(){return D.filter(x=>sel.has(G.indexOf(x.g)))}
function setup(){
 live=false;clearInterval(tick);$('h2').textContent='';$('tm').textContent='';$('mk').hidden=true;$('ft').innerHTML='<span>Tutor mode: answers and explanations show immediately</span>';
 $('app').innerHTML=`<div class="card"><h2 style="margin-top:0">Create block</h2><p>Questions per block</p><div class="sg">${[0,10,25,40,100].map(v=>`<button data-v="${v}" class="${size===v?'on':''}">${v||'All'}</button>`).join('')}</div>
 <p><label><input type="checkbox" id="sq" ${shufQ?'checked':''}> Shuffle question order</label></p>
 <p><span id="cnt"></span> <button class="sg" style="border:0;background:none;color:#16365c;text-decoration:underline;cursor:pointer" id="all">Select all</button> <button style="border:0;background:none;color:#16365c;text-decoration:underline;cursor:pointer" id="none">Clear</button></p>
 <div class="chips">${G.map((g,k)=>`<label><input type="checkbox" data-k="${k}" ${sel.has(k)?'checked':''}><span>${E(g)} (${cnt[k]})</span></label>`).join('')}</div><p><button class="bt" id="go">Start block</button></p></div>`;
 const u=()=>{const m=pool().length;$('cnt').textContent=sel.size+' of '+G.length+' focuses, '+m+' questions.';$('go').disabled=!m};
 document.querySelectorAll('.sg button[data-v]').forEach(b=>b.onclick=()=>{size=+b.dataset.v;document.querySelectorAll('.sg button[data-v]').forEach(c=>c.classList.toggle('on',c===b))});

 $('all').onclick=()=>all(1);$('none').onclick=()=>all(0);$('sq').onchange=e=>{shufQ=e.target.checked};$('go').onclick=()=>start(pool(),size);u();
}
function start(p,lim,re){
 if(!re)last={p,lim};
 let a=p.map((x,i)=>({...x,o:sh([x.c,...x.w]),a:null,m:false,i}));if(lim&&a.length>lim){a=sh(a).slice(0,lim);if(!shufQ)a.sort((u,v)=>u.i-v.i)}else if(shufQ)sh(a);

$('mk').onclick=()=>{Q[n].m=!Q[n].m;show()};
document.addEventListener('keydown',e=>{if(!live||!Q.length)return;const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0)pick(k%4);else if(e.key==='ArrowRight'&&n<Q.length-1){n++;show()}else if(e.key==='ArrowLeft'&&n>0){n--;show()}});
